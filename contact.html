<!DOCTYPE html>
<html>

<head>

<title>Contact Us</title>

<style>

body{
    background:black;
    color:white;
    font-family:Arial;
    padding:20px;
}

h1{
    color:gold;
    text-align:center;
}

form{
    background:#111;
    padding:20px;
    border-radius:15px;
    border:1px solid gold;
    max-width:400px;
    margin:auto;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button{
    margin-top:15px;
    padding:12px 20px;
    background:gold;
    border:none;
    border-radius:10px;
    font-size:18px;
}

</style>

</head>

<body>

<h1>Contact Us</h1>

<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea rows="5" placeholder="Your Message"></textarea>

<button type="submit">
Send Message
</button>

</form>

</body>

</html>
